name: epiguard-ai CI/CD

on:
  push:
    branches:
      - main
      - test
      - headie-one
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/epiguard-ai
  PYTHON_VERSION: "3.11"
  VPS_APP_DIR: /opt/apps/epiguard-ai/epiguard-micorservice-ai

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: epiguard_test
          POSTGRES_USER: epiguard
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epiguard -d epiguard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate gRPC proto files
        run: |
          python -m grpc_tools.protoc \
            -I proto \
            --python_out=. \
            --grpc_python_out=. \
            proto/triage.proto

      - name: Run unit tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: epiguard_test
          POSTGRES_USER: epiguard
          POSTGRES_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          LOG_LEVEL: WARNING
        run: |
          pytest tests/unit \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Run integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: epiguard_test
          POSTGRES_USER: epiguard
          POSTGRES_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          LOG_LEVEL: WARNING
        run: |
          pytest tests/integration \
            -v \
            --tb=short

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch

      - name: Build and push runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="${{ env.VPS_APP_DIR }}"; fi

            echo "── Deploying to $APP_DIR ──"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Repo not found at $APP_DIR — clone it first on the server."
              exit 1
            fi

            DEPLOY_USER="$(whoami)"
            echo "── Fixing repo ownership for $DEPLOY_USER ──"
            sudo chown -R "$DEPLOY_USER:$DEPLOY_USER" "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR" || true

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            echo "── Pulling latest Docker image ──"
            docker pull ${{ env.DOCKER_IMAGE }}:latest
            docker tag ${{ env.DOCKER_IMAGE }}:latest epiguard-ai:latest

            echo "── Starting production stack (API + nginx) ──"
            docker compose -f docker-compose.prod.yml pull nginx 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up -d --no-build

            echo "── Waiting for health check ──"
            sleep 12
            curl -sf http://localhost:8000/health || (echo "API health check failed" && exit 1)
            curl -sf http://localhost/health || (echo "Nginx health check failed" && exit 1)

            echo "── Cleaning up old images ──"
            docker image prune -f

            echo "── Deploy complete ──"
            echo "   Demo:    http://4.168.192.169/"
            echo "   Swagger: http://4.168.192.169/docs"

  notify:
    name: Notify deployment result
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Deployment succeeded
        if: needs.deploy.result == 'success'
        run: |
          echo "epiguard-ai deployed successfully"
          echo "   Commit : ${{ github.sha }}"
          echo "   Author : ${{ github.actor }}"

      - name: Deployment failed
        if: needs.deploy.result == 'failure'
        run: |
          echo "Deployment failed — check logs above"
          exit 1
